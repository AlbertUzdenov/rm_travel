                  <div style={{fontSize:13,color:'#555',lineHeight:1.5,whiteSpace:'pre-wrap'}}>{a.note}</div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}

      {editing&&(
        <div className={isMobile?'modal-overlay-mobile':''} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:isMobile?'flex-start':'center',justifyContent:'center',zIndex:200,padding:isMobile?12:20}} onClick={()=>setEditing(null)}>
          <div className={isMobile?'modal-sheet-mobile':''} style={{background:'white',borderRadius:14,padding:isMobile?20:24,width:isMobile?'100%':480,maxHeight:isMobile?'none':'auto',overflow:isMobile?'visible':'auto'}} onClick={e=>e.stopPropagation()}>
            <h3 style={{margin:'0 0 16px'}}>{accounts.find(x=>x.id===editing.id)?'Редактировать кабинет':'Новый личный кабинет'}</h3>
            <div style={{display:'flex',flexDirection:'column',gap:12}}>
              <Field label="Название" required><input value={editing.name} onChange={e=>setEditing({...editing,name:e.target.value})} style={inp} autoFocus placeholder="Например: Островок"/></Field>
              <Field label="Логин"><input value={editing.login} onChange={e=>setEditing({...editing,login:e.target.value})} style={inp} placeholder="логин / email"/></Field>
              <Field label="Пароль"><input value={editing.password} onChange={e=>setEditing({...editing,password:e.target.value})} style={inp} placeholder="пароль"/></Field>
              <Field label="Комментарий"><textarea value={editing.note} onChange={e=>setEditing({...editing,note:e.target.value})} style={{...inp,minHeight:70,resize:'vertical'}} placeholder="Доп. информация..."/></Field>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:20}}>
              <button onClick={()=>setEditing(null)} style={{...btnSec,flex:isMobile?1:'none'}}>Отмена</button>
              <button onClick={()=>editing.name.trim()&&saveAccount(editing)} style={{...btnPri,flex:isMobile?1:'none'}} className="btn-primary">Сохранить</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ============ APP ============
function App(){
  const isMobile=useIsMobile();
  const [user,setUser]=useState(null);
  const [authChecked,setAuthChecked]=useState(false);
  const [approved,setApproved]=useState(false);
  const [isAdmin,setIsAdmin]=useState(false);
  const [deals,setDeals]=useState([]);
  const [clients,setClients]=useState([]);
  const [services,setServices]=useState([]);
  const [accounts,setAccounts]=useState([]);
  const [loading,setLoading]=useState(false);
  const [view,setView]=useState('dashboard');
  const [year,setYear]=useState(new Date().getFullYear());

  // Auth
  useEffect(()=>{
    (async()=>{
      const{data:{session:existing}}=await sb.auth.getSession();
      if(existing){const{error}=await sb.auth.refreshSession();if(error){await sb.auth.signOut();setUser(null);setAuthChecked(true);return;}}
      const{data:{session}}=await sb.auth.getSession();
      setUser(session?.user||null);setAuthChecked(true);
    })();
    const{data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{setUser(session?.user||null);});
    return()=>subscription.unsubscribe();
  },[]);

  // Check approval
  useEffect(()=>{
    if(!user){setApproved(false);return;}
    (async()=>{
      let{data,error}=await sb.from('user_approvals').select('*').eq('user_id',user.id).single();
      if(error&&!data){await sb.auth.refreshSession();const retry=await sb.from('user_approvals').select('*').eq('user_id',user.id).single();data=retry.data;}
      setApproved(data?.approved===true);
      setIsAdmin(data?.is_admin===true);
    })();
  },[user]);

  // Load data
  const reload=useCallback(async()=>{
    if(!user)return;
    setLoading(true);
    const[{data:d},{data:c},{data:s}]=await Promise.all([
      sb.from('deals').select('*').order('date',{ascending:false}),
      sb.from('clients').select('*').order('created_at',{ascending:false}),
      sb.from('services').select('*').order('created_at',{ascending:false}),
    ]);
    // Convert snake_case to camelCase
    setDeals((d||[]).map(r=>({...r,dealNumber:r.deal_number,startDate:r.start_date,endDate:r.end_date,cancelDeadline:r.cancel_deadline,clientId:r.client_id,serviceId:r.service_id,rateSource:r.rate_source,rateWithMarkup:r.rate_with_markup,grossRub:r.gross_rub,netRub:r.net_rub,commissionRub:r.commission_rub,createdAt:r.created_at,updatedAt:r.updated_at,createdBy:r.created_by,createdByEmail:r.created_by_email,createdByName:r.created_by_name})));
    setClients((c||[]).map(r=>({...r,firstName:r.first_name,lastName:r.last_name,createdAt:r.created_at})));
    setServices((s||[]).map(r=>({...r,createdAt:r.created_at})));
    const{data:ac}=await sb.from('accounts').select('*').order('created_at',{ascending:false});
    setAccounts((ac||[]).map(r=>({...r,createdBy:r.created_by,createdByEmail:r.created_by_email,createdByName:r.created_by_name,createdAt:r.created_at})));
    setLoading(false);
  },[user]);

  useEffect(()=>{if(user)reload();},[user,reload]);

  // Realtime subscriptions
  useEffect(()=>{
    if(!user)return;
    const ch=sb.channel('crm-changes')
      .on('postgres_changes',{event:'*',schema:'public',table:'deals'},()=>reload())
      .on('postgres_changes',{event:'*',schema:'public',table:'clients'},()=>reload())
      .on('postgres_changes',{event:'*',schema:'public',table:'services'},()=>reload())
      .subscribe();
    return()=>sb.removeChannel(ch);
  },[user,reload]);

  const years=useMemo(()=>[...new Set(deals.map(d=>new Date(d.date).getFullYear()))].sort(),[deals]);
  useEffect(()=>{if(years.length>0&&!years.includes(year))setYear(years[years.length-1]);},[years,year]);

  const logout=async()=>{await sb.auth.signOut();setUser(null);setDeals([]);setClients([]);setServices([]);};

  if(!authChecked) return <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg, #3D5F94, #5680BF)'}}><div style={{color:'white',fontSize:16,display:'flex',alignItems:'center',gap:12}}><div style={{width:24,height:24,border:'2px solid rgba(255,255,255,0.4)',borderTopColor:'white',borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/> Загрузка...<style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div></div>;

  if(!user) return <AuthScreen onLogin={u=>setUser(u)}/>;

  if(!approved) return <ApprovalPending user={user} onLogout={logout}/>;

  // МОБИЛЬНЫЙ layout
  if(isMobile){
    return (
      <div style={{minHeight:'100vh',background:BG,paddingBottom:70}}>
        <MobileHeader user={user} onLogout={logout}/>
        <div style={{padding:'16px 12px'}}>
          {loading&&<div style={{position:'fixed',top:60,right:12,background:'white',padding:'6px 12px',borderRadius:8,boxShadow:'0 2px 8px rgba(0,0,0,0.12)',fontSize:12,color:BRAND,display:'flex',alignItems:'center',gap:6,zIndex:45}}><div style={{width:12,height:12,border:'2px solid #ddd',borderTopColor:BRAND,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/> Синхр...<style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div>}
          {view==='dashboard'&&<Dashboard deals={deals} clients={clients} services={services} year={year} setYear={setYear} years={years} isMobile={isMobile}/>}
          {view==='deals'&&<Deals deals={deals} clients={clients} services={services} reload={reload} isMobile={isMobile}/>}
          {view==='clients'&&<Clients clients={clients} deals={deals} services={services} reload={reload} isMobile={isMobile}/>}
          {view==='services'&&<Services services={services} deals={deals} clients={clients} reload={reload} isMobile={isMobile}/>}
          {view==='finance'&&<Finance deals={deals} isMobile={isMobile}/>}
          {view==='analytics'&&<Analytics deals={deals} services={services} clients={clients} isMobile={isMobile}/>}
          {view==='accounts'&&<Accounts accounts={accounts} reload={reload} user={user} isMobile={isMobile}/>}
          {view==='settings'&&<SettingsView deals={deals} clients={clients} services={services} user={user} reload={reload} isMobile={isMobile} isAdmin={isAdmin}/>}
        </div>
        <Sidebar view={view} setView={setView} user={user} onLogout={logout} isMobile={isMobile}/>
      </div>
    );
  }

  // ДЕСКТОП layout
  return (
    <div style={{display:'flex',minHeight:'100vh',background:BG}}>
      <Sidebar view={view} setView={setView} user={user} onLogout={logout} isMobile={isMobile}/>
      <div style={{flex:1,padding:28,overflow:'auto'}}>
        {loading&&<div style={{position:'fixed',top:16,right:16,background:'white',padding:'8px 16px',borderRadius:8,boxShadow:'0 2px 8px rgba(0,0,0,0.12)',fontSize:13,color:BRAND,display:'flex',alignItems:'center',gap:8,zIndex:999}}><div style={{width:14,height:14,border:'2px solid #ddd',borderTopColor:BRAND,borderRadius:'50%',animation:'spin 0.8s linear infinite'}}/> Синхронизация...<style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style></div>}
        {view==='dashboard'&&<Dashboard deals={deals} clients={clients} services={services} year={year} setYear={setYear} years={years} isMobile={isMobile}/>}
        {view==='deals'&&<Deals deals={deals} clients={clients} services={services} reload={reload} isMobile={isMobile}/>}
        {view==='clients'&&<Clients clients={clients} deals={deals} services={services} reload={reload} isMobile={isMobile}/>}
        {view==='services'&&<Services services={services} deals={deals} clients={clients} reload={reload} isMobile={isMobile}/>}
        {view==='finance'&&<Finance deals={deals} isMobile={isMobile}/>}
        {view==='analytics'&&<Analytics deals={deals} services={services} clients={clients} isMobile={isMobile}/>}
        {view==='accounts'&&<Accounts accounts={accounts} reload={reload} user={user} isMobile={isMobile}/>}
          {view==='settings'&&<SettingsView deals={deals} clients={clients} services={services} user={user} reload={reload} isMobile={isMobile} isAdmin={isAdmin}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
