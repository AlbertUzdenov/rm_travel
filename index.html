<script>
// Встроенный Supabase-клиент (без CDN зависимости)
function createSupabaseClient(baseUrl, apiKey) {
  const PREFIX = 'sb-' + baseUrl.split('//')[1].split('.')[0];
  const getT = () => localStorage.getItem(PREFIX + '-tk');
  const setT = t => t ? localStorage.setItem(PREFIX + '-tk', t) : localStorage.removeItem(PREFIX + '-tk');
  const getR = () => localStorage.getItem(PREFIX + '-rt');
  const setR = t => t ? localStorage.setItem(PREFIX + '-rt', t) : localStorage.removeItem(PREFIX + '-rt');
  const getU = () => { try { return JSON.parse(localStorage.getItem(PREFIX + '-usr')); } catch { return null; } };
  const setU = u => u ? localStorage.setItem(PREFIX + '-usr', JSON.stringify(u)) : localStorage.removeItem(PREFIX + '-usr');
  let listeners = [];
  const notify = (ev, s) => listeners.forEach(fn => { try { fn(ev, s); } catch(e) { console.error(e); } });
  const hdrs = () => ({ 'apikey': apiKey, 'Authorization': 'Bearer ' + (getT() || apiKey), 'Content-Type': 'application/json' });

  const auth = {
    getSession: async () => { const t = getT(), u = getU(); return { data: { session: t && u ? { user: u, access_token: t } : null } }; },
    getUser: async () => ({ data: { user: getU() } }),
    refreshSession: async () => {
      const rt = getR();
      if (!rt) return { data: { session: null }, error: { message: 'no refresh token' } };
      try {
        const r = await fetch(baseUrl + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { 'apikey': apiKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: rt }) });
        const d = await r.json();
        if (!r.ok || !d.access_token) return { data: { session: null }, error: { message: 'refresh failed' } };
        setT(d.access_token); setR(d.refresh_token); setU(d.user);
        return { data: { session: { user: d.user, access_token: d.access_token } }, error: null };
      } catch (e) { return { data: { session: null }, error: { message: e.message } }; }
    },
    signInWithPassword: async ({ email, password }) => {
      try {
        const r = await fetch(baseUrl + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { 'apikey': apiKey, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const d = await r.json();
        if (!r.ok) return { data: null, error: { message: d.error_description || d.msg || d.error || 'Ошибка входа' } };
        setT(d.access_token); setR(d.refresh_token); setU(d.user);
        notify('SIGNED_IN', { user: d.user });
        return { data: { user: d.user }, error: null };
      } catch (e) { return { data: null, error: { message: e.message } }; }
    },
    signUp: async ({ email, password, options }) => {
      try {
        const body = { email, password }; if (options && options.data) body.data = options.data;
        const r = await fetch(baseUrl + '/auth/v1/signup', { method: 'POST', headers: { 'apikey': apiKey, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const d = await r.json();
        if (!r.ok) return { data: null, error: { message: d.error_description || d.msg || d.error || 'Ошибка регистрации' } };
        if (d.access_token) { setT(d.access_token); setR(d.refresh_token); setU(d.user); notify('SIGNED_IN', { user: d.user }); }
        return { data: { user: d.user || d }, error: null };
      } catch (e) { return { data: null, error: { message: e.message } }; }
    },
    signOut: async () => { try { await fetch(baseUrl + '/auth/v1/logout', { method: 'POST', headers: hdrs() }); } catch {} setT(null); setR(null); setU(null); notify('SIGNED_OUT', null); return { error: null }; },
    onAuthStateChange: (fn) => { listeners.push(fn); return { data: { subscription: { unsubscribe: () => { listeners = listeners.filter(f => f !== fn); } } } }; },
  };

  const from = (table) => {
    const exec = (method, body, params, single, prefer) => {
      const qs = params.length ? '?' + params.join('&') : '';
      const h = hdrs();
      if (single) h['Accept'] = 'application/vnd.pgrst.object+json';
      if (prefer) h['Prefer'] = prefer;
      const opts = { method, headers: h };
      if (body !== null && body !== undefined) opts.body = JSON.stringify(body);
      return fetch(baseUrl + '/rest/v1/' + table + qs, opts).then(r => {
        if (r.status === 204) return { data: null, error: null };
        const ct = r.headers.get('content-length');
        if (ct === '0') return { data: null, error: null };
        return r.text().then(txt => {
          if (!txt) return { data: single ? null : [], error: null };
          try { const j = JSON.parse(txt); return r.ok ? { data: j, error: null } : { data: single ? null : [], error: j }; }
          catch { return { data: single ? null : [], error: null }; }
        });
      });
    };
    const chain = (method, body, params, single, prefer) => ({
      order: (col, o) => chain(method, body, [...params, 'order=' + col + '.' + (o && o.ascending === false ? 'desc' : 'asc')], single, prefer),
      eq: (col, val) => chain(method, body, [...params, col + '=eq.' + encodeURIComponent(val)], single, prefer),
      single: () => chain(method, body, params, true, prefer),
      then: (ok, fail) => exec(method, body, params, single, prefer).then(ok, fail),
    });
    return {
      select: (cols) => chain('GET', null, ['select=' + encodeURIComponent(cols || '*')], false, null),
      insert: (data) => chain('POST', data, [], false, 'return=minimal'),
      update: (data) => ({ eq: (col, val) => chain('PATCH', data, [col + '=eq.' + encodeURIComponent(val)], false, 'return=minimal') }),
      delete: () => ({ eq: (col, val) => chain('DELETE', null, [col + '=eq.' + encodeURIComponent(val)], false, null) }),
      upsert: (data, opts) => {
        const p = []; if (opts && opts.onConflict) p.push('on_conflict=' + opts.onConflict);
        return chain('POST', data, p, false, 'return=minimal,resolution=merge-duplicates');
      },
    };
  };

  const channel = () => { const ch = { on: () => ch, subscribe: () => ch }; return ch; };
  const removeChannel = () => {};
  return { auth, from, channel, removeChannel };
}
window.createSupabaseClient = createSupabaseClient;

  const [isMobile,setIsMobile]=useState(typeof window!=='undefined'&&window.innerWidth<=768);
  useEffect(()=>{
    const onResize=()=>setIsMobile(window.innerWidth<=768);
    window.addEventListener('resize',onResize);
    return()=>window.removeEventListener('resize',onResize);
  },[]);
  return isMobile;
};

const fmtRub=n=>{if(n===null||n===undefined||isNaN(n))return'—';if(n===0)return'0 ₽';const s=n<0?'-':'';return s+Math.abs(Math.round(n)).toLocaleString('ru-RU')+' ₽';};
const fmtSize=b=>b<1024?b+' Б':b<1024*1024?(b/1024).toFixed(1)+' КБ':(b/1024/1024).toFixed(1)+' МБ';
const fmtDate=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleDateString('ru-RU')+' '+d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});};
const todayISO=()=>new Date().toISOString().slice(0,10);
const phoneMask=s=>{const digits=String(s||'').replace(/\D/g,'').slice(0,11);if(!digits)return'';let n=digits;if(n[0]==='8')n='7'+n.slice(1);if(n[0]!=='7')n='7'+n;n=n.slice(0,11);const p1=n.slice(1,4),p2=n.slice(4,7),p3=n.slice(7,9),p4=n.slice(9,11);let out='+7';if(p1)out+=' ('+p1+(p1.length===3?')':'');if(p2)out+=' '+p2;if(p3)out+='-'+p3;if(p4)out+='-'+p4;return out;};

// camelCase <-> snake_case conversions
const toCamel=obj=>{
  if(!obj||typeof obj!=='object') return obj;
  if(Array.isArray(obj)) return obj.map(toCamel);
  const result={};
  for(const [k,v] of Object.entries(obj)){
    const camel=k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());
    result[camel]=toCamel(v);
  }
  return result;
};
const toSnake=obj=>{
  if(!obj||typeof obj!=='object') return obj;
  if(Array.isArray(obj)) return obj.map(toSnake);
  const result={};
  for(const [k,v] of Object.entries(obj)){
    const snake=k.replace(/([A-Z])/g,c=>'_'+c.toLowerCase());
    result[snake]=(v&&typeof v==='object'&&!Array.isArray(v))?toSnake(v):v;
  }
  return result;
};

const fetchRate=async(code,dateISO)=>{
  if(code==='RUB')return{rate:1,source:'rub',date:dateISO};
  let cache={};try{cache=JSON.parse(localStorage.getItem(RATES_CACHE_KEY)||'{}')}catch(e){}
  const ck=code+':'+dateISO;
  if(cache[ck])return cache[ck];
  try{
    const today=todayISO();
    const url=dateISO===today?'https://www.cbr-xml-daily.ru/daily_json.js':'https://www.cbr-xml-daily.ru/archive/'+dateISO.replace(/-/g,'/')+'/daily_json.js';
    const resp=await fetch(url);if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    if(data&&data.Valute&&data.Valute[code]){const v=data.Valute[code],rate=v.Value/v.Nominal;const result={rate,source:'cbr',date:dateISO};cache[ck]=result;try{localStorage.setItem(RATES_CACHE_KEY,JSON.stringify(cache))}catch(e){}return result;}
    throw new Error('Not found');
  }catch(e){const fb={USD:95,EUR:100,AED:26,TRY:2.6};return{rate:fb[code]||1,source:'offline',date:dateISO};}
};

const addToYandexCalendar=(deal,clientName,serviceName)=>{
  // Format: YYYYMMDDTHHmmss — Яндекс требует именно этот формат
  const fmtYandex=iso=>{
    if(!iso) return null;
    // iso = 'YYYY-MM-DD', добавляем T000000
    return iso.replace(/-/g,'')+'T000000';
  };
  const start=fmtYandex(deal.startDate);
  const end=fmtYandex(deal.endDate||deal.startDate);
  if(!start){alert('Укажите дату старта в сделке, чтобы добавить событие в календарь.');return;}

  const title=encodeURIComponent(serviceName);
  const desc=encodeURIComponent([
    'Клиент: '+clientName,
    'Статус: '+deal.status,
    deal.note?'Комментарий: '+deal.note:''
  ].filter(Boolean).join('\n'));

  // Яндекс Календарь: form=event — открывает форму создания нового события
  const url=`https://calendar.yandex.ru/event/edit?name=${title}&description=${desc}&dtstart=${start}&dtend=${end}`;
  window.open(url,'_blank');
};

const AuthScreen=({onLogin})=>{
  const [mode,setMode]=useState('login');

  const [name,setName]=useState('');

  const [error,setError]=useState('');
  const [info,setInfo]=useState('');

  const handle=async()=>{
    setLoading(true);setError('');setInfo('');
    try{
      if(mode==='login'){
        const{data,error:err}=await sb.auth.signInWithPassword({email,password:pass});
        if(err)throw err;
        onLogin(data.user);
      } else {
        const{data,error:err}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name}}});
        if(err)throw err;
        setInfo('Проверьте почту для подтверждения. Если письма нет — попробуйте войти напрямую.');
      }

  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg, #3D5F94 0%, #5680BF 100%)',display:'flex',alignItems:'center',justifyContent:'center',padding:20}}>
      <div style={{background:'white',borderRadius:16,padding:40,width:400,boxShadow:'0 20px 60px rgba(0,0,0,0.2)'}}>

          <div style={{fontSize:14,color:'#888',marginTop:4}}>CRM система · командный доступ</div>
        </div>
        <div style={{display:'flex',gap:8,marginBottom:24,background:'#f5f5f5',borderRadius:8,padding:4}}>
          {['login','register'].map(m=>(
            <button key={m} onClick={()=>{setMode(m);setError('');setInfo('');}} style={{flex:1,padding:'8px',border:'none',borderRadius:6,cursor:'pointer',fontWeight:600,fontSize:13,background:mode===m?'white':' transparent',color:mode===m?BRAND:'#888',boxShadow:mode===m?'0 1px 4px rgba(0,0,0,0.1)':'none',transition:'all 0.15s'}}>

// ============ FILE UPLOAD ============
const FileUpload=({files,onChange})=>{
  const [dragActive,setDragActive]=useState(false);
  const inputRef=useRef(null);
  const allowed=['.pdf','.jpg','.jpeg','.png','.docx','.xlsx'];
  const MAX=5*1024*1024;
  const readFile=file=>new Promise((res,rej)=>{if(file.size>MAX){rej(new Error(file.name+': превышает 5 МБ'));return;}const ext='.'+file.name.split('.').pop().toLowerCase();if(!allowed.includes(ext)){rej(new Error(file.name+': недопустимый формат'));return;}const r=new FileReader();r.onload=()=>res({id:uid(),name:file.name,size:file.size,type:file.type,data:r.result});r.onerror=()=>rej(new Error('Ошибка'));r.readAsDataURL(file);});
  const handleFiles=async fileList=>{const errors=[],ok=[];for(const f of fileList){try{ok.push(await readFile(f));}catch(e){errors.push(e.message);}}if(errors.length)alert(errors.join('\n'));if(ok.length)onChange([...(files||[]),...ok]);};
  const onDrop=e=>{e.preventDefault();setDragActive(false);handleFiles(e.dataTransfer.files);};
  const removeFile=id=>onChange((files||[]).filter(f=>f.id!==id));
  const downloadFile=f=>{const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click();};
  return (
    <div>
      <div onDragEnter={e=>{e.preventDefault();setDragActive(true);}} onDragLeave={e=>{e.preventDefault();setDragActive(false);}} onDragOver={e=>e.preventDefault()} onDrop={onDrop} onClick={()=>inputRef.current.click()} className={dragActive?'dropzone-active':''} style={{border:'2px dashed #ddd',borderRadius:8,padding:18,textAlign:'center',cursor:'pointer',background:'#fafafa',transition:'all 0.15s'}}>
        <Icon name="upload" size={22} color="#999"/>
        <div style={{fontSize:13,color:'#666',marginTop:6}}>Перетащите файлы или <span style={{color:BRAND,fontWeight:600}}>выберите</span></div>
        <div style={{fontSize:11,color:'#aaa',marginTop:4}}>PDF, JPG, PNG, DOCX, XLSX · до 5 МБ</div>
        <input ref={inputRef} type="file" multiple accept={allowed.join(',')} style={{display:'none'}} onChange={e=>{handleFiles(e.target.files);e.target.value='';}}/>
      </div>
      {files&&files.length>0&&(
        <div style={{marginTop:10,display:'flex',flexDirection:'column',gap:6}}>
          {files.map(f=>(
            <div key={f.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'white',border:'1px solid #eee',borderRadius:6}}>
              <Icon name="file" size={16} color={BRAND}/>
              <div style={{flex:1,minWidth:0,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
              <div style={{fontSize:11,color:'#888'}}>{fmtSize(f.size)}</div>
              <button onClick={e=>{e.stopPropagation();downloadFile(f);}} style={{...btnGhost,padding:'2px 6px',fontSize:12}}>Скачать</button>
              <span onClick={e=>{e.stopPropagation();removeFile(f.id);}} style={{cursor:'pointer'}}><Icon name="trash" size={14} color="#d32f2f"/></span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

const DealForm=({deal,clients,services,onSave,onClose,addClient,addService,isMobile})=>{
  const initial=deal||{id:uid(),date:todayISO(),startDate:'',endDate:'',cancelDeadline:'',clientId:null,serviceId:null,category:'Авиабилеты',net:0,gross:0,currency:'RUB',rate:1,rateSource:'rub',rateWithMarkup:1,status:'В работе',note:'',files:[],history:[],createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  const [d,setD]=useState(initial);
  const [saving,setSaving]=useState(false);
  const [errors,setErrors]=useState({});

  const setField=(k,v)=>setD(prev=>({...prev,[k]:v,updatedAt:new Date().toISOString()}));

  useEffect(()=>{
    if(!d.serviceId)return;
    const s=services.find(x=>x.id===d.serviceId);
    if(!s)return;
    setD(prev=>({...prev,category:s.category||prev.category,gross:prev.gross||s.price||0}));
  },[d.serviceId]);

  const commission=Math.max(0,(Number(d.gross)||0)-(Number(d.net)||0));

  useEffect(()=>{
    let active=true;
    if(d.currency==='RUB'){setD(prev=>({...prev,rate:1,rateSource:'rub',rateWithMarkup:1}));return;}
    (async()=>{const r=await fetchRate(d.currency,d.date);if(!active)return;setD(prev=>({...prev,rate:r.rate,rateSource:r.source,rateWithMarkup:r.rate*CB_MARKUP}));})();
    return()=>{active=false;};
  },[d.currency,d.date]);

  const grossRub=d.currency==='RUB'?(Number(d.gross)||0):(Number(d.gross)||0)*(d.rateWithMarkup||1);
  const netRub=d.currency==='RUB'?(Number(d.net)||0):(Number(d.net)||0)*(d.rateWithMarkup||1);
  const commissionRub=grossRub-netRub;

  const handleSave=async()=>{
    const errs={};
    if(!d.clientId)errs.clientId='Выберите клиента';
    if(!d.serviceId)errs.serviceId='Выберите услугу';
    if(!d.gross)errs.gross='Укажите сумму';
    if(!d.date)errs.date='Укажите дату';
    if(Object.keys(errs).length){setErrors(errs);return;}
    const svc=services.find(x=>x.id===d.serviceId);
    setSaving(true);
    await onSave({...d,title:svc?svc.name:'',commission,grossRub,netRub,commissionRub,updatedAt:new Date().toISOString()});
    setSaving(false);
  };

  const selectedService=services.find(x=>x.id===d.serviceId);
  const selectedClient=clients.find(x=>x.id===d.clientId);

  return (
    <div className={isMobile?'modal-overlay-mobile':''} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:isMobile?'flex-start':'center',justifyContent:'center',zIndex:100,padding:isMobile?12:20}}>
      <div className={isMobile?'modal-sheet-mobile':''} style={{background:'white',borderRadius:isMobile?14:12,padding:isMobile?20:28,width:isMobile?'100%':700,maxHeight:isMobile?'none':'92vh',overflow:isMobile?'visible':'auto'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
          <h2 style={{margin:0,fontSize:isMobile?18:20}}>{deal?(deal.dealNumber?'Сделка №'+deal.dealNumber:'Редактировать сделку'):'Новая сделка'}</h2>
          <div style={{display:'flex',gap:10,alignItems:'center'}}>
            {(d.startDate||d.endDate)&&selectedService&&selectedClient&&!isMobile&&(
              <button onClick={()=>addToYandexCalendar(d,(selectedClient.firstName+' '+selectedClient.lastName).trim(),selectedService.name)} style={{...btnSec,padding:'8px 12px',fontSize:12,color:'#c44',borderColor:'#fbb'}}>
                <Icon name="calendar" size={13} style={{verticalAlign:'middle',marginRight:4}} color="#c44"/> Яндекс Календарь
              </button>
            )}
            <span style={{cursor:'pointer',padding:4}} onClick={onClose}><Icon name="x" size={22} color="#888"/></span>
          </div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:14}}>
          <Field label="Клиент" full required error={errors.clientId}>
            <ClientPicker clients={clients} selectedId={d.clientId} onSelect={id=>setField('clientId',id)} onCreate={addClient}/>
          </Field>
          <Field label="Услуга" full required error={errors.serviceId} hint="выберите из базы или создайте">
            <ServicePicker services={services} selectedId={d.serviceId} onSelect={id=>setField('serviceId',id)} onCreate={addService} currentCategory={d.category}/>
          </Field>
          <Field label="Категория">
            <select value={d.category} onChange={e=>setField('category',e.target.value)} style={inp}>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
          </Field>
          <Field label="Дата сделки" required error={errors.date} hint="курс ЦБ на эту дату">
            <input type="date" value={d.date} onChange={e=>setField('date',e.target.value)} style={inp}/>
          </Field>
          <Field label="Дата старта"><input type="date" value={d.startDate||''} onChange={e=>setField('startDate',e.target.value)} style={inp}/></Field>
          <Field label="Дата окончания"><input type="date" value={d.endDate||''} onChange={e=>setField('endDate',e.target.value)} style={inp}/></Field>
          <Field label="Дедлайн по отмене без штрафа" full hint="до какой даты можно отменить бесплатно"><input type="date" value={d.cancelDeadline||''} onChange={e=>setField('cancelDeadline',e.target.value)} style={inp}/></Field>
          <Field label="Валюта">
            <select value={d.currency} onChange={e=>setField('currency',e.target.value)} style={inp}>{CURRENCIES.map(c=><option key={c.code} value={c.code}>{c.code} — {c.label}</option>)}</select>
          </Field>
          <Field label="Курс ЦБ + 3.5%" hint={d.rateSource==='cbr'?'ЦБ РФ':d.rateSource==='offline'?'офлайн':'—'}>
            <input value={d.currency==='RUB'?'— не применяется —':(d.rate.toFixed(4)+' × 1.035 = '+d.rateWithMarkup.toFixed(4))} style={inpReadOnly} readOnly/>
          </Field>
          <Field label="Нетто"><input type="number" step="0.01" value={d.net||''} onChange={e=>setField('net',parseFloat(e.target.value)||0)} placeholder="0" style={inp}/></Field>
          <Field label="Брутто" required error={errors.gross}><input type="number" step="0.01" value={d.gross||''} onChange={e=>setField('gross',parseFloat(e.target.value)||0)} placeholder="0" style={inp}/></Field>
          <Field label="Комиссия" hint="авто"><input value={commission.toLocaleString('ru-RU',{maximumFractionDigits:2})+' '+(CURRENCIES.find(c=>c.code===d.currency)?.symbol||'')} style={inpReadOnly} readOnly/></Field>
          <Field label="Комиссия в ₽" hint="по курсу с наценкой"><input value={fmtRub(commissionRub)} style={{...inpReadOnly,fontWeight:600,color:BRAND}} readOnly/></Field>
          <Field label="Статус" full hint="только «Завершен» — в финансах">
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              {STATUSES.map(s=><div key={s.id} onClick={()=>setField('status',s.id)} style={{padding:'8px 14px',borderRadius:8,border:'2px solid '+(d.status===s.id?s.color:'#eee'),cursor:'pointer',background:d.status===s.id?s.bg:'white',color:d.status===s.id?s.color:'#666',fontSize:12,fontWeight:600,transition:'all 0.15s'}}>{s.id}</div>)}
            </div>
          </Field>
          <Field label="Комментарий" full>
            <textarea value={d.note} onChange={e=>setField('note',e.target.value)} style={{...inp,minHeight:60,resize:'vertical'}} placeholder="Дополнительная информация..."/>
          </Field>
          <Field label="Документы" full hint="до 5 МБ на файл">
            <FileUpload files={d.files||[]} onChange={files=>setField('files',files)}/>
          </Field>
        </div>
        {isMobile&&(d.startDate||d.endDate)&&selectedService&&selectedClient&&(
          <button onClick={()=>addToYandexCalendar(d,(selectedClient.firstName+' '+selectedClient.lastName).trim(),selectedService.name)} style={{...btnSec,width:'100%',marginTop:16,padding:'12px',fontSize:13,color:'#c44',borderColor:'#fbb',display:'flex',alignItems:'center',justifyContent:'center',gap:6}}>
            <Icon name="calendar" size={14} color="#c44"/> Добавить в Яндекс Календарь
          </button>
        )}
        <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:24}}>
          <button onClick={onClose} style={{...btnSec,flex:isMobile?1:'none'}} disabled={saving}>Отмена</button>
          <button onClick={handleSave} disabled={saving} style={{...btnPri,opacity:saving?0.7:1,flex:isMobile?1:'none'}} className="btn-primary">{saving?'Сохранение...':'Сохранить'}</button>
        </div>
      </div>
    </div>
  );

  const [deleting,setDeleting]=useState(null);
  const [viewDeal,setViewDeal]=useState(null);

  const cName=id=>{const c=clients.find(x=>x.id===id);return c?((c.firstName+' '+c.lastName).trim()||'Без имени'):'—';};
  const sName=d=>{if(d.serviceId){const s=services.find(x=>x.id===d.serviceId);if(s)return s.name;}return d.title||'—';};

  const filtered=useMemo(()=>deals.filter(d=>{
    const dt=new Date(d.date);
    if(search){const q=search.toLowerCase();if(!cName(d.clientId).toLowerCase().includes(q)&&!sName(d).toLowerCase().includes(q)&&!(d.category||'').toLowerCase().includes(q))return false;}
    if(filterYear!=='all'&&dt.getFullYear()!==Number(filterYear))return false;
    if(filterMonth!=='all'&&dt.getMonth()!==Number(filterMonth))return false;
    if(filterStatus!=='all'&&d.status!==filterStatus)return false;
    if(filterCategory!=='all'&&d.category!==filterCategory)return false;
    if(filterStartFrom&&d.startDate&&d.startDate<filterStartFrom)return false;
    if(filterStartTo&&d.startDate&&d.startDate>filterStartTo)return false;
    if(filterEndFrom&&d.endDate&&d.endDate<filterEndFrom)return false;
    if(filterEndTo&&d.endDate&&d.endDate>filterEndTo)return false;
    return true;
  }).sort((a,b)=>new Date(b.date)-new Date(a.date)),[deals,clients,services,search,filterYear,filterMonth,filterStatus,filterCategory,filterStartFrom,filterStartTo,filterEndFrom,filterEndTo]);

  const paidFiltered=filtered.filter(isPaidClient);

  const saveDeal=async deal=>{
    const row=toSnake({...deal});
    // Пустые даты -> null (Postgres не принимает пустую строку для типа date)
    if(!row.start_date) row.start_date=null;
    if(!row.end_date) row.end_date=null;
    if(!row.cancel_deadline) row.cancel_deadline=null;
    delete row.deal_number; // номер управляется базой, не перезаписываем
    if(editing){
      await sb.from('deals').update(row).eq('id',deal.id);
    } else {
      // Сохраняем автора при создании
      const{data:{user:u}}=await sb.auth.getUser();
      row.created_by=u?.id||null;
      row.created_by_email=u?.email||null;
      row.created_by_name=u?.user_metadata?.full_name||u?.email||null;
      await sb.from('deals').insert(row);
    }
    reload();setShowForm(false);setEditing(null);
  };

  const deleteDeal=async id=>{
    if(!confirm('Удалить сделку?'))return;
    setDeleting(id);
    await sb.from('deals').delete().eq('id',id);
    reload();setDeleting(null);
  };

  const quickStatus=async(id,status)=>{
    const deal=deals.find(d=>d.id===id);
    if(!deal)return;
    const history=[...(deal.history||[]),{ts:new Date().toISOString(),changes:[{field:'status',from:deal.status,to:status}]}];
    await sb.from('deals').update({status,history,updated_at:new Date().toISOString()}).eq('id',id);
    reload();
  };

  const addClient=async data=>{
    const c={id:uid(),first_name:data.firstName,last_name:data.lastName,phone:data.phone||'',email:data.email||'',telegram:data.telegram||'',comments:[],created_at:new Date().toISOString()};
    await sb.from('clients').insert(c);reload();return c.id;
  };
  const addService=async data=>{
    const s={id:uid(),name:data.name,description:data.description||'',category:data.category||'Другое',price:data.price||0,active:true,phone:'',email:'',telegram:'',created_at:new Date().toISOString()};
    await sb.from('services').insert(s);reload();return s.id;
  };

  const exportCsv=()=>{
    const headers=['№','Дата','Дата старта','Дата окончания','Клиент','Услуга','Категория','Нетто','Брутто','Комиссия','Валюта','Курс','Доход ₽','Оборот ₽','Статус','Автор','Комментарий'];
    const rows=filtered.map(d=>[d.dealNumber||'',d.date,d.startDate||'',d.endDate||'',cName(d.clientId),sName(d),d.category,d.net,d.gross,d.commission,d.currency,d.rateWithMarkup,d.commissionRub,d.grossRub,d.status,d.createdByName||d.createdByEmail||'',d.note]);
    const csv=[headers,...rows].map(r=>r.map(c=>'"'+(c??'').toString().replace(/"/g,'""')+'"').join(',')).join('\n');
    const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='RM-Travel-'+todayISO()+'.csv';a.click();
  };

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <h1 style={{margin:0,fontSize:24}}>Сделки</h1>
          <p style={{margin:'4px 0 0',color:'#888',fontSize:14}}>
            {filtered.length} сделок · Оплачено: <b style={{color:'#2E7D32'}}>{paidFiltered.length}</b> · Доход: <b style={{color:BRAND}}>{fmtRub(paidFiltered.reduce((s,d)=>s+(d.commissionRub||0),0))}</b>
          </p>
        </div>
        <div style={{display:'flex',gap:8}}>
          <button onClick={exportCsv} style={btnSec}><Icon name="download" size={14} style={{verticalAlign:'middle',marginRight:4}}/>CSV</button>
          <button onClick={()=>{setEditing(null);setShowForm(true);}} style={btnPri} className="btn-primary"><Icon name="plus" size={14} color="white" style={{verticalAlign:'middle',marginRight:4}}/>Новая сделка</button>
        </div>
      </div>

      <div style={{background:'white',borderRadius:12,padding:16,marginBottom:16,display:'flex',gap:10,flexWrap:'wrap',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <div style={{flex:1,minWidth:220,position:'relative'}}>
          <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={16} color="#888"/></span>
          <input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,paddingLeft:36}}/>
        </div>
        <select value={filterYear} onChange={e=>setFilterYear(e.target.value)} style={{...inp,width:'auto'}}>
          <option value="all">Все годы</option>
          {[...new Set(deals.map(d=>new Date(d.date).getFullYear()))].sort().reverse().map(y=><option key={y} value={y}>{y}</option>)}
        </select>
        <select value={filterMonth} onChange={e=>setFilterMonth(e.target.value)} style={{...inp,width:'auto'}}><option value="all">Все месяцы</option>{MONTHS.map((m,i)=><option key={i} value={i}>{m}</option>)}</select>
        <select value={filterCategory} onChange={e=>setFilterCategory(e.target.value)} style={{...inp,width:'auto'}}><option value="all">Все категории</option>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={{...inp,width:'auto'}}><option value="all">Все статусы</option>{STATUSES.map(s=><option key={s.id} value={s.id}>{s.id}</option>)}</select>
        <div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:12,color:'#888',whiteSpace:'nowrap'}}>Старт:</span><input type="date" value={filterStartFrom} onChange={e=>setFilterStartFrom(e.target.value)} style={{...inp,width:'auto'}} title="Старт с"/><span style={{color:'#ccc'}}>—</span><input type="date" value={filterStartTo} onChange={e=>setFilterStartTo(e.target.value)} style={{...inp,width:'auto'}} title="Старт по"/></div>
        <div style={{display:'flex',alignItems:'center',gap:6}}><span style={{fontSize:12,color:'#888',whiteSpace:'nowrap'}}>Конец:</span><input type="date" value={filterEndFrom} onChange={e=>setFilterEndFrom(e.target.value)} style={{...inp,width:'auto'}} title="Конец с"/><span style={{color:'#ccc'}}>—</span><input type="date" value={filterEndTo} onChange={e=>setFilterEndTo(e.target.value)} style={{...inp,width:'auto'}} title="Конец по"/></div>
      </div>

      <div style={{background:'white',borderRadius:12,overflow:'hidden',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        {filtered.length===0 ? (
          <div style={{padding:60,textAlign:'center',color:'#888'}}><div style={{fontSize:36,marginBottom:12}}>📋</div><div>{deals.length===0?'Сделок ещё нет':'Ничего не найдено'}</div></div>
        ):(
          <div style={{overflowX:'auto',maxHeight:'calc(100vh - 320px)',overflowY:'auto'}}>
            <table style={{width:'100%',fontSize:13}}>
              <thead style={{position:'sticky',top:0,background:BRAND_LIGHT,zIndex:1}}>
                <tr>{['№','Дата','Старт','Конец','Клиент','Услуга','Кат.','Брутто','Доход ₽','Вал.','Автор','Статус',''].map(h=>(
                  <th key={h} style={{padding:'12px 10px',textAlign:'left',fontWeight:600,color:BRAND_DARK,borderBottom:'1px solid #ddd',whiteSpace:'nowrap'}}>{h}</th>
                ))}</tr>
              </thead>
              <tbody>
                {filtered.map(d=>{
                  const paid=isPaidClient(d);
                  const svc=services.find(x=>x.id===d.serviceId);
                  const cl=clients.find(x=>x.id===d.clientId);
                  const authorLabel=d.createdByName||d.createdByEmail||'—';
                  const authorShort=authorLabel.length>16?authorLabel.slice(0,14)+'…':authorLabel;
                  return (
                    <tr key={d.id} style={{borderBottom:'2px solid #d5dae0',opacity:deleting===d.id?0.3:paid?1:0.75,cursor:'pointer',background:d.status==='Завершен'?'#EEEEEE':'transparent'}}
                      onClick={()=>setViewDeal(d)}>
                      <td style={{padding:'10px',fontWeight:700,color:BRAND,fontSize:12,whiteSpace:'nowrap'}}>{d.dealNumber?'№'+d.dealNumber:'—'}</td>
                      <td style={{padding:'10px',color:'#666',whiteSpace:'nowrap',fontSize:12}}>{new Date(d.date).toLocaleDateString('ru-RU')}</td>
                      <td style={{padding:'10px',color:'#888',fontSize:12,whiteSpace:'nowrap'}}>{d.startDate?new Date(d.startDate).toLocaleDateString('ru-RU'):'—'}</td>
                      <td style={{padding:'10px',color:'#888',fontSize:12,whiteSpace:'nowrap'}}>{d.endDate?new Date(d.endDate).toLocaleDateString('ru-RU'):'—'}</td>
                      <td style={{padding:'10px',fontWeight:500,maxWidth:130,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{cName(d.clientId)}</td>
                      <td style={{padding:'10px',color:'#666',maxWidth:150,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{sName(d)}</td>
                      <td style={{padding:'10px',color:'#888',fontSize:12}}>{d.category}</td>
                      <td style={{padding:'10px',textAlign:'right'}}>{d.gross?Number(d.gross).toLocaleString('ru-RU'):'—'}</td>
                      <td style={{padding:'10px',textAlign:'right',fontWeight:600,color:paid?BRAND:'#aaa'}}>{fmtRub(d.commissionRub)}</td>
                      <td style={{padding:'10px'}}><span style={{padding:'2px 8px',borderRadius:4,background:d.currency==='EUR'?'#E3F2FD':d.currency==='USD'?'#E8F5E9':d.currency==='AED'?'#FFF8E1':d.currency==='TRY'?'#FCE4EC':'#FFF3E0',fontSize:11,fontWeight:600}}>{d.currency}</span></td>
                      <td style={{padding:'10px',fontSize:11,color:'#888',whiteSpace:'nowrap'}} title={authorLabel}>
                        <div style={{display:'flex',alignItems:'center',gap:5}}>
                          <div style={{width:20,height:20,borderRadius:'50%',background:BRAND_LIGHT,color:BRAND,display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,fontWeight:700,flexShrink:0}}>{authorLabel[0]?.toUpperCase()||'?'}</div>
                          {authorShort}
                        </div>
                      </td>
                      <td style={{padding:'10px'}} onClick={e=>e.stopPropagation()}>
                        <select value={d.status} onChange={e=>quickStatus(d.id,e.target.value)} style={{padding:'4px 8px',borderRadius:12,fontSize:11,fontWeight:600,background:(STATUSES.find(x=>x.id===d.status)||{}).bg,color:(STATUSES.find(x=>x.id===d.status)||{}).color,border:'none',cursor:'pointer'}}>
                          {STATUSES.map(s=><option key={s.id} value={s.id}>{s.id}</option>)}
                        </select>
                      </td>
                      <td style={{padding:'10px',whiteSpace:'nowrap'}} onClick={e=>e.stopPropagation()}>
                        {d.startDate&&svc&&cl&&<span style={{cursor:'pointer',marginRight:8}} title="Яндекс Календарь" onClick={()=>addToYandexCalendar(d,(cl.firstName+' '+cl.lastName).trim(),svc.name)}><Icon name="calendar" size={14} color="#c44"/></span>}
                        <span style={{cursor:'pointer',marginRight:8}} onClick={()=>{setEditing(d);setShowForm(true);}}><Icon name="edit" size={14} color={BRAND}/></span>
                        <span style={{cursor:'pointer'}} onClick={()=>deleteDeal(d.id)}><Icon name="trash" size={14} color="#d32f2f"/></span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {/* КАРТОЧКА СДЕЛКИ */}
      {viewDeal&&(()=>{
        const d=viewDeal;
        const cl=clients.find(x=>x.id===d.clientId);
        const svc=services.find(x=>x.id===d.serviceId);
        const paid=isPaidClient(d);
        const authorLabel=d.createdByName||d.createdByEmail||'Неизвестен';
        const st=STATUSES.find(x=>x.id===d.status)||{color:'#888',bg:'#f0f0f0'};
        return (
          <div className={isMobile?'modal-overlay-mobile':''} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.45)',display:'flex',alignItems:isMobile?'flex-start':'center',justifyContent:'center',zIndex:100,padding:isMobile?12:20}} onClick={()=>setViewDeal(null)}>
            <div className={isMobile?'modal-sheet-mobile':''} style={{background:'white',borderRadius:14,padding:isMobile?20:32,width:isMobile?'100%':640,maxHeight:isMobile?'none':'90vh',overflow:isMobile?'visible':'auto',boxShadow:'0 20px 60px rgba(0,0,0,0.2)'}} onClick={e=>e.stopPropagation()}>
              {/* Header */}
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>
                <div style={{flex:1,minWidth:0}}>
                  {d.dealNumber&&<div style={{fontSize:13,fontWeight:700,color:BRAND,marginBottom:4}}>Сделка №{d.dealNumber}</div>}
                  <div style={{fontSize:isMobile?18:20,fontWeight:700,marginBottom:6}}>{svc?svc.name:(d.title||'Сделка')}</div>
                  <StatusBadge status={d.status}/>
                </div>
                <span style={{cursor:'pointer',padding:4}} onClick={()=>setViewDeal(null)}><Icon name="x" size={22} color="#888"/></span>
              </div>

              {/* Кнопки действий */}
              <div style={{display:'flex',gap:8,marginBottom:20,flexWrap:'wrap'}}>
                {d.startDate&&svc&&cl&&(
                  <button onClick={()=>addToYandexCalendar(d,(cl.firstName+' '+cl.lastName).trim(),svc.name)} style={{...btnSec,padding:'10px 14px',fontSize:13,color:'#c44',borderColor:'#fbb',display:'flex',alignItems:'center',gap:6,flex:isMobile?1:'none',justifyContent:'center'}}>
                    <Icon name="calendar" size={14} color="#c44"/> Календарь
                  </button>
                )}
                <button onClick={()=>{setViewDeal(null);setEditing(d);setShowForm(true);}} style={{...btnSec,padding:'10px 14px',fontSize:13,display:'flex',alignItems:'center',gap:6,flex:isMobile?1:'none',justifyContent:'center'}}>
                  <Icon name="edit" size={14} color={BRAND}/> Изменить
                </button>
              </div>

              {/* Сетка полей */}
              <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:0,border:'1px solid #f0f0f0',borderRadius:10,overflow:'hidden',marginBottom:20}}>
                {[
                  ['Клиент', cl?(cl.firstName+' '+cl.lastName).trim()||'Без имени':'—'],
                  ['Услуга', svc?svc.name:(d.title||'—')],
                  ['Категория', d.category||'—'],
                  ['Статус', <StatusBadge status={d.status}/>],
                  ['Дата сделки', d.date?new Date(d.date).toLocaleDateString('ru-RU'):'—'],
                  ['Автор', <span style={{display:'flex',alignItems:'center',gap:6}}><div style={{width:22,height:22,borderRadius:'50%',background:BRAND_LIGHT,color:BRAND,display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700}}>{authorLabel[0]?.toUpperCase()||'?'}</div>{authorLabel}</span>],
                  ['Дата старта', d.startDate?new Date(d.startDate).toLocaleDateString('ru-RU'):'—'],
                  ['Дата окончания', d.endDate?new Date(d.endDate).toLocaleDateString('ru-RU'):'—'],
                  ['Дедлайн отмены без штрафа', d.cancelDeadline?new Date(d.cancelDeadline).toLocaleDateString('ru-RU'):'—'],
                  ['Валюта', d.currency],
                  ['Курс (с наценкой)', d.currency==='RUB'?'—':(d.rateWithMarkup||1).toFixed(4)],
                  ['Нетто', d.net?(Number(d.net).toLocaleString('ru-RU')+' '+(CURRENCIES.find(c=>c.code===d.currency)?.symbol||'')):'—'],
                  ['Брутто', d.gross?(Number(d.gross).toLocaleString('ru-RU')+' '+(CURRENCIES.find(c=>c.code===d.currency)?.symbol||'')):'—'],
                  ['Комиссия', d.commission?(Number(d.commission).toLocaleString('ru-RU')+' '+(CURRENCIES.find(c=>c.code===d.currency)?.symbol||'')):'—'],
                  ['Доход (₽)', <span style={{fontWeight:700,color:paid?BRAND:'#aaa'}}>{fmtRub(d.commissionRub)}</span>],
                  ['Оборот (₽)', fmtRub(d.grossRub)],
                  ['Создана', d.createdAt?fmtDate(d.createdAt):'—'],
                ].map(([label,val],i)=>(
                  <div key={label} style={{padding:'12px 16px',background:(isMobile?i%2===0:i%4<2)?'#fafafa':'white',borderBottom:'1px solid #f0f0f0'}}>
                    <div style={{fontSize:11,color:'#aaa',marginBottom:3,textTransform:'uppercase',letterSpacing:0.3}}>{label}</div>
                    <div style={{fontSize:13,fontWeight:500,color:'#222'}}>{val}</div>
                  </div>
                ))}
              </div>

              {/* Комментарий */}
              {d.note&&(
                <div style={{background:'#FFFDE7',border:'1px solid #FFF9C4',borderRadius:8,padding:'12px 16px',marginBottom:16}}>
                  <div style={{fontSize:11,color:'#aaa',marginBottom:4,textTransform:'uppercase',letterSpacing:0.3}}>Комментарий</div>
                  <div style={{fontSize:13,color:'#555',lineHeight:1.6,whiteSpace:'pre-wrap'}}>{d.note}</div>
                </div>
              )}

              {/* Файлы */}
              {(d.files||[]).length>0&&(
                <div>
                  <div style={{fontSize:11,color:'#aaa',marginBottom:8,textTransform:'uppercase',letterSpacing:0.3}}>Документы ({d.files.length})</div>
                  <div style={{display:'flex',flexDirection:'column',gap:6}}>
                    {d.files.map(f=>(
                      <div key={f.id} style={{display:'flex',alignItems:'center',gap:10,padding:'8px 12px',background:'#fafafa',border:'1px solid #eee',borderRadius:6}}>
                        <Icon name="file" size={15} color={BRAND}/>
                        <div style={{flex:1,fontSize:13,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{f.name}</div>
                        <div style={{fontSize:11,color:'#aaa'}}>{fmtSize(f.size)}</div>
                        <button onClick={()=>{const a=document.createElement('a');a.href=f.data;a.download=f.name;a.click();}} style={{...btnGhost,padding:'2px 8px',fontSize:12}}>Скачать</button>
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {showForm&&<DealForm deal={editing} clients={clients} services={services} addClient={addClient} addService={addService} onSave={saveDeal} onClose={()=>{setShowForm(false);setEditing(null);}} isMobile={isMobile}/>}
    </div>
  );
};

// ============ CLIENTS ============
const EditCommentInline=({text,onSave,onCancel})=>{
  const [val,setVal]=useState(text);
  return (
    <div>
      <textarea value={val} onChange={e=>setVal(e.target.value)} style={{...inp,minHeight:60,resize:'vertical',marginBottom:8}} autoFocus/>
      <div style={{display:'flex',gap:8}}>
        <button onClick={()=>val.trim()&&onSave(val.trim())} style={{...btnPri,padding:'6px 12px',fontSize:12}}>Сохранить</button>
        <button onClick={onCancel} style={{...btnSec,padding:'6px 12px',fontSize:12}}>Отмена</button>
      </div>
    </div>
  );
};

const Clients=({clients,deals,services,reload,isMobile})=>{
  const [search,setSearch]=useState('');
  const [selected,setSelected]=useState(null);
  const [editing,setEditing]=useState(null);
  const [commentText,setCommentText]=useState('');
  const [editingComment,setEditingComment]=useState(null);

  const enriched=useMemo(()=>clients.map(c=>{
    const cDeals=deals.filter(d=>d.clientId===c.id);
    const paidDeals=cDeals.filter(isPaidClient);
    return{...c,deals:cDeals,paidCount:paidDeals.length,total:paidDeals.reduce((s,d)=>s+(d.commissionRub||0),0),gross:paidDeals.reduce((s,d)=>s+(d.grossRub||0),0)};
  }).sort((a,b)=>b.total-a.total),[clients,deals]);

  const filtered=enriched.filter(c=>{const q=search.toLowerCase();return !q||(c.firstName+' '+c.lastName+' '+(c.phone||'')+' '+(c.email||'')+' '+(c.telegram||'')).toLowerCase().includes(q);});
  const selectedEnriched=selected?enriched.find(x=>x.id===selected.id)||selected:null;

  const deleteClient=async id=>{
    const cDeals=deals.filter(d=>d.clientId===id);
    if(cDeals.length>0){alert('Нельзя удалить: привязаны сделки ('+cDeals.length+').');return;}
    if(!confirm('Удалить клиента?'))return;
    await sb.from('clients').delete().eq('id',id);
    reload();setSelected(null);
  };

  const saveClient=async c=>{
    const row={id:c.id,first_name:c.firstName,last_name:c.lastName,phone:c.phone||'',email:c.email||'',telegram:c.telegram||'',comments:c.comments||[]};
    if(clients.find(x=>x.id===c.id)){await sb.from('clients').update(row).eq('id',c.id);}
    else{await sb.from('clients').insert({...row,created_at:new Date().toISOString()});}
    reload();setEditing(null);
    // refresh selected
    const{data}=await sb.from('clients').select('*').eq('id',c.id).single();
    if(data)setSelected(toCamel({...data,first_name:data.first_name,last_name:data.last_name}));
  };

  const updateComments=async comments=>{
    if(!selected)return;
    await sb.from('clients').update({comments}).eq('id',selected.id);
    reload();
    setSelected(prev=>({...prev,comments}));
  };

  const addComment=async()=>{
    if(!commentText.trim()||!selected)return;
    const comment={id:uid(),text:commentText.trim(),createdAt:new Date().toISOString()};
    const comments=[...(selected.comments||[]),comment];
    await updateComments(comments);setCommentText('');
  };
  const deleteComment=async cid=>{
    const comments=(selected.comments||[]).filter(c=>c.id!==cid);
    await updateComments(comments);
  };
  const saveComment=async(cid,text)=>{
    const comments=(selected.comments||[]).map(c=>c.id===cid?{...c,text,updatedAt:new Date().toISOString()}:c);
    await updateComments(comments);setEditingComment(null);
  };

  const sName=d=>{if(d.serviceId){const s=services.find(x=>x.id===d.serviceId);if(s)return s.name;}return d.title||'—';};

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div><h1 style={{margin:0,fontSize:isMobile?20:24}}>Клиенты</h1><p style={{margin:'4px 0 0',color:'#888',fontSize:14}}>{clients.length} в базе</p></div>
        <button onClick={()=>setEditing({id:uid(),firstName:'',lastName:'',phone:'',email:'',telegram:'',comments:[]})} style={btnPri} className="btn-primary">
          <Icon name="plus" size={14} color="white" style={{verticalAlign:'middle',marginRight:isMobile?0:4}}/>{!isMobile&&'Добавить клиента'}
        </button>
      </div>
      <PaidOnlyBanner/>
      <div style={{background:'white',borderRadius:12,padding:16,marginBottom:16,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <div style={{position:'relative'}}><span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={16} color="#888"/></span><input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,paddingLeft:36}}/></div>
      </div>
      {filtered.length===0 ? (
        <div style={{background:'white',borderRadius:12,padding:60,textAlign:'center'}}><div style={{fontSize:36,marginBottom:12}}>👥</div><div>{clients.length===0?'Клиентов ещё нет':'Ничего не найдено'}</div></div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(290px, 1fr))',gap:14}}>
          {filtered.map(c=>(
            <div key={c.id} onClick={()=>setSelected(c)} className="card-hover" style={{background:'white',borderRadius:12,padding:18,cursor:'pointer',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
              <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:14}}>
                <div style={{width:42,height:42,borderRadius:'50%',background:BRAND,color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:16}}>{(c.firstName[0]||c.lastName[0]||'?').toUpperCase()}</div>
                <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(c.firstName+' '+c.lastName).trim()||'Без имени'}</div><div style={{fontSize:12,color:'#888'}}>{c.deals.length} сделок · {c.paidCount} оплачено</div></div>
              </div>
              {(c.phone||c.email)&&(<div style={{fontSize:12,color:'#666',marginBottom:10,display:'flex',flexDirection:'column',gap:4}}>{c.phone&&<div style={{display:'flex',alignItems:'center',gap:6}}><Icon name="phone" size={11} color="#999"/>{c.phone}</div>}{c.email&&<div style={{display:'flex',alignItems:'center',gap:6}}><Icon name="mail" size={11} color="#999"/>{c.email}</div>}</div>)}
              {(c.comments||[]).length>0&&<div style={{fontSize:11,color:'#888',marginBottom:8}}>💬 {(c.comments||[]).length}</div>}
              <div style={{display:'flex',justifyContent:'space-between',paddingTop:12,borderTop:'1px solid #f0f0f0'}}>
                <div><div style={{fontSize:11,color:'#888'}}>Доход</div><div style={{fontSize:15,fontWeight:700,color:BRAND}}>{fmtRub(c.total)}</div></div>
                <div style={{textAlign:'right'}}><div style={{fontSize:11,color:'#888'}}>Оборот</div><div style={{fontSize:14,fontWeight:600}}>{fmtRub(c.gross)}</div></div>
              </div>
            </div>
          ))}
        </div>
      )}

      {selectedEnriched&&(
        <div className={isMobile?'modal-overlay-mobile':''} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:isMobile?'flex-start':'center',justifyContent:'center',zIndex:100,padding:isMobile?12:20}} onClick={()=>setSelected(null)}>
          <div className={isMobile?'modal-sheet-mobile':''} style={{background:'white',borderRadius:14,padding:isMobile?20:28,width:isMobile?'100%':800,maxHeight:isMobile?'none':'90vh',overflow:isMobile?'visible':'auto'}} onClick={e=>e.stopPropagation()}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:isMobile?'flex-start':'center',marginBottom:20,gap:12}}>
              <div style={{display:'flex',alignItems:'center',gap:14,minWidth:0}}>
                <div style={{width:52,height:52,borderRadius:'50%',background:BRAND,color:'white',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:20,flexShrink:0}}>{(selectedEnriched.firstName[0]||selectedEnriched.lastName[0]||'?').toUpperCase()}</div>
                <div style={{minWidth:0}}><h2 style={{margin:0,fontSize:isMobile?18:20,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{(selectedEnriched.firstName+' '+selectedEnriched.lastName).trim()||'Без имени'}</h2><p style={{margin:'2px 0 0',color:'#888',fontSize:13}}>{selectedEnriched.deals.length} сделок · Доход {fmtRub(selectedEnriched.total)}</p></div>
              </div>
              <div style={{display:'flex',gap:8,flexShrink:0}}>
                {!isMobile&&<button onClick={()=>setEditing(selectedEnriched)} style={btnGhost}><Icon name="edit" size={14} style={{verticalAlign:'middle',marginRight:4}}/>Изменить</button>}
                {isMobile&&<span style={{cursor:'pointer'}} onClick={()=>setEditing(selectedEnriched)}><Icon name="edit" size={18} color={BRAND}/></span>}
                {!isMobile&&<button onClick={()=>deleteClient(selectedEnriched.id)} style={{...btnGhost,color:'#d32f2f'}}><Icon name="trash" size={14} color="#d32f2f" style={{verticalAlign:'middle',marginRight:4}}/>Удалить</button>}
                <span style={{cursor:'pointer'}} onClick={()=>setSelected(null)}><Icon name="x" size={20} color="#888"/></span>
              </div>
            </div>
            {(selectedEnriched.phone||selectedEnriched.email||selectedEnriched.telegram)&&(
              <div style={{background:BRAND_LIGHT,padding:14,borderRadius:8,marginBottom:16,display:'flex',gap:isMobile?10:20,flexWrap:'wrap',fontSize:13,flexDirection:isMobile?'column':'row'}}>
                {selectedEnriched.phone&&<div><b>Телефон:</b> <a href={'tel:'+selectedEnriched.phone} style={{color:BRAND}}>{selectedEnriched.phone}</a></div>}
                {selectedEnriched.email&&<div><b>Email:</b> <a href={'mailto:'+selectedEnriched.email} style={{color:BRAND}}>{selectedEnriched.email}</a></div>}
                {selectedEnriched.telegram&&<div><b>Telegram/WA:</b> {selectedEnriched.telegram}</div>}
              </div>
            )}
            {selectedEnriched.deals.length>0 ? (
              isMobile ? (
                <div style={{display:'flex',flexDirection:'column',gap:8,marginBottom:24}}>
                  {[...selectedEnriched.deals].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(d=>(
                    <div key={d.id} style={{background:'#fafafa',borderRadius:8,padding:12,opacity:isPaidClient(d)?1:0.6}}>
                      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
                        <span style={{fontSize:13,fontWeight:500}}>{sName(d)}</span>
                        <StatusBadge status={d.status}/>
                      </div>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'#888'}}>
                        <span>{new Date(d.date).toLocaleDateString('ru-RU')}</span>
                        <span style={{fontWeight:600,color:isPaidClient(d)?BRAND:'#aaa'}}>{fmtRub(d.commissionRub)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
              <table style={{width:'100%',fontSize:13,marginBottom:24}}>
                <thead><tr style={{background:BRAND_LIGHT}}><th style={{padding:10,textAlign:'left'}}>Дата</th><th style={{padding:10,textAlign:'left'}}>Старт</th><th style={{padding:10,textAlign:'left'}}>Услуга</th><th style={{padding:10,textAlign:'right'}}>Брутто ₽</th><th style={{padding:10,textAlign:'right'}}>Доход ₽</th><th style={{padding:10}}>Статус</th></tr></thead>
                <tbody>{[...selectedEnriched.deals].sort((a,b)=>new Date(b.date)-new Date(a.date)).map(d=>(
                  <tr key={d.id} style={{borderBottom:'1px solid #f0f0f0',opacity:isPaidClient(d)?1:0.6}}>
                    <td style={{padding:10,fontSize:12,color:'#666'}}>{new Date(d.date).toLocaleDateString('ru-RU')}</td>
                    <td style={{padding:10,fontSize:12,color:'#888'}}>{d.startDate?new Date(d.startDate).toLocaleDateString('ru-RU'):'—'}</td>
                    <td style={{padding:10}}>{sName(d)}</td>
                    <td style={{padding:10,textAlign:'right'}}>{fmtRub(d.grossRub)}</td>
                    <td style={{padding:10,textAlign:'right',fontWeight:600,color:isPaidClient(d)?BRAND:'#aaa'}}>{fmtRub(d.commissionRub)}</td>
                    <td style={{padding:10}}><StatusBadge status={d.status}/></td>
                  </tr>
                ))}</tbody>
              </table>
              )
            ):<div style={{textAlign:'center',padding:24,color:'#888',marginBottom:24}}>Нет сделок</div>}

            <div style={{borderTop:'2px solid #f0f0f0',paddingTop:20}}>
              <h3 style={{margin:'0 0 14px',fontSize:16,display:'flex',alignItems:'center',gap:8}}><Icon name="message" size={16} color={BRAND}/>Комментарии ({(selectedEnriched.comments||[]).length})</h3>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                <textarea value={commentText} onChange={e=>setCommentText(e.target.value)} placeholder="Добавить комментарий..." style={{...inp,minHeight:60,resize:'vertical',flex:1}} onKeyDown={e=>{if(e.key==='Enter'&&e.ctrlKey)addComment();}}/>
                <button onClick={addComment} disabled={!commentText.trim()} style={{...btnPri,padding:'10px 16px',alignSelf:'flex-end',opacity:commentText.trim()?1:0.5}}><Icon name="send" size={14} color="white"/></button>
              </div>
              {(selectedEnriched.comments||[]).length===0 ? (
                <div style={{textAlign:'center',padding:24,color:'#aaa',fontSize:13}}>Нет комментариев</div>
              ):(
                <div style={{display:'flex',flexDirection:'column',gap:10}}>
                  {[...(selectedEnriched.comments||[])].reverse().map(cm=>(
                    <div key={cm.id} style={{background:'#fafafa',borderRadius:8,padding:12,border:'1px solid #f0f0f0'}}>
                      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                        <div style={{fontSize:11,color:'#888'}}>{fmtDate(cm.createdAt)}{cm.updatedAt&&<span style={{color:'#bbb'}}> (ред.)</span>}</div>
                        <div style={{display:'flex',gap:8}}>
                          <span style={{cursor:'pointer'}} onClick={()=>setEditingComment(cm.id)}><Icon name="edit" size={13} color={BRAND}/></span>
                          <span style={{cursor:'pointer'}} onClick={()=>deleteComment(cm.id)}><Icon name="trash" size={13} color="#d32f2f"/></span>
                        </div>
                      </div>
                      {editingComment===cm.id ? <EditCommentInline text={cm.text} onSave={t=>saveComment(cm.id,t)} onCancel={()=>setEditingComment(null)}/> : <div style={{fontSize:13,lineHeight:1.5,whiteSpace:'pre-wrap'}}>{cm.text}</div>}
                    </div>
                  ))}
                </div>
              )}
            </div>
            {isMobile&&<button onClick={()=>deleteClient(selectedEnriched.id)} style={{...btnSec,width:'100%',marginTop:20,color:'#d32f2f',borderColor:'#ffcdd2'}}><Icon name="trash" size={14} color="#d32f2f" style={{verticalAlign:'middle',marginRight:4}}/>Удалить клиента</button>}
          </div>
        </div>
      )}

      {editing&&(
        <div className={isMobile?'modal-overlay-mobile':''} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:isMobile?'flex-start':'center',justifyContent:'center',zIndex:200,padding:isMobile?12:20}} onClick={()=>setEditing(null)}>
          <div className={isMobile?'modal-sheet-mobile':''} style={{background:'white',borderRadius:14,padding:isMobile?20:24,width:isMobile?'100%':480,maxHeight:isMobile?'none':'auto',overflow:isMobile?'visible':'auto'}} onClick={e=>e.stopPropagation()}>
            <h3 style={{margin:'0 0 16px'}}>{clients.find(x=>x.id===editing.id)?'Редактировать':'Новый клиент'}</h3>
            <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr':'1fr 1fr',gap:12}}>
              <Field label="Имя" required><input value={editing.firstName} onChange={e=>setEditing({...editing,firstName:e.target.value})} style={inp} autoFocus/></Field>
              <Field label="Фамилия"><input value={editing.lastName} onChange={e=>setEditing({...editing,lastName:e.target.value})} style={inp}/></Field>
              <Field label="Телефон"><input value={editing.phone} onChange={e=>setEditing({...editing,phone:phoneMask(e.target.value)})} placeholder="+7 (___) ___-__-__" style={inp}/></Field>
              <Field label="Email"><input type="email" value={editing.email} onChange={e=>setEditing({...editing,email:e.target.value})} style={inp}/></Field>
              <Field label="Telegram / WhatsApp" full><input value={editing.telegram} onChange={e=>setEditing({...editing,telegram:e.target.value})} style={inp} placeholder="@username"/></Field>
            </div>
            <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:20}}>
              <button onClick={()=>setEditing(null)} style={{...btnSec,flex:isMobile?1:'none'}}>Отмена</button>
              <button onClick={()=>editing.firstName.trim()&&saveClient(editing)} style={{...btnPri,flex:isMobile?1:'none'}} className="btn-primary">Сохранить</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
};

// ============ SERVICES ============
const Services=({services,deals,clients,reload,isMobile})=>{
  const [search,setSearch]=useState('');
  const [filterCategory,setFilterCategory]=useState('all');
  const [filterActive,setFilterActive]=useState('all');
  const [selected,setSelected]=useState(null);
  const [editing,setEditing]=useState(null);

  const enriched=useMemo(()=>services.map(s=>{
    const sDeals=deals.filter(d=>d.serviceId===s.id);
    const paidDeals=sDeals.filter(isPaidClient);
    return{...s,deals:sDeals,paidCount:paidDeals.length,totalCount:sDeals.length,revenue:paidDeals.reduce((sum,d)=>sum+(d.commissionRub||0),0),gross:paidDeals.reduce((sum,d)=>sum+(d.grossRub||0),0),avg:paidDeals.length?paidDeals.reduce((sum,d)=>sum+(d.commissionRub||0),0)/paidDeals.length:0,conversion:sDeals.length?(paidDeals.length/sDeals.length*100):0};
  }).sort((a,b)=>b.revenue-a.revenue),[services,deals]);

  const filtered=enriched.filter(s=>{
    if(search){const q=search.toLowerCase();if(!(s.name+' '+(s.description||'')+' '+(s.category||'')).toLowerCase().includes(q))return false;}
    if(filterCategory!=='all'&&s.category!==filterCategory)return false;
    if(filterActive==='active'&&s.active===false)return false;
    if(filterActive==='inactive'&&s.active!==false)return false;
    return true;
  });

  const deleteService=async id=>{
    const sDeals=deals.filter(d=>d.serviceId===id);
    if(sDeals.length>0){if(!confirm('Привязано сделок: '+sDeals.length+'. Удалить?'))return;}else{if(!confirm('Удалить услугу?'))return;}
    await sb.from('services').delete().eq('id',id);reload();setSelected(null);
  };
  const toggleActive=async id=>{
    const s=services.find(x=>x.id===id);
    await sb.from('services').update({active:s.active===false?true:false}).eq('id',id);reload();
  };
  const saveService=async s=>{
    const row={id:s.id,name:s.name,description:s.description||'',category:s.category||'Другое',price:s.price||0,active:s.active!==false,phone:s.phone||'',email:s.email||'',telegram:s.telegram||''};
    if(services.find(x=>x.id===s.id)){await sb.from('services').update(row).eq('id',s.id);}
    else{await sb.from('services').insert({...row,created_at:new Date().toISOString()});}
    reload();setEditing(null);
  };
  const cName=id=>{const c=clients.find(x=>x.id===id);return c?((c.firstName+' '+c.lastName).trim()||'Без имени'):'—';};

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <div><h1 style={{margin:0,fontSize:isMobile?20:24}}>Услуги</h1><p style={{margin:'4px 0 0',color:'#888',fontSize:14}}>Каталог · {services.length} услуг</p></div>
        <button onClick={()=>setEditing({id:uid(),name:'',description:'',category:'Авиабилеты',price:0,active:true,phone:'',email:'',telegram:''})} style={btnPri} className="btn-primary">
          <Icon name="plus" size={14} color="white" style={{verticalAlign:'middle',marginRight:isMobile?0:4}}/>{!isMobile&&'Добавить услугу'}
        </button>
      </div>
      <PaidOnlyBanner/>
      <div style={{background:'white',borderRadius:12,padding:16,marginBottom:16,display:'flex',gap:10,flexWrap:'wrap',boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <div style={{flex:1,minWidth:220,position:'relative'}}><span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)'}}><Icon name="search" size={16} color="#888"/></span><input placeholder="Поиск..." value={search} onChange={e=>setSearch(e.target.value)} style={{...inp,paddingLeft:36}}/></div>
        <select value={filterCategory} onChange={e=>setFilterCategory(e.target.value)} style={{...inp,width:'auto'}}><option value="all">Все категории</option>{CATEGORIES.map(c=><option key={c} value={c}>{c}</option>)}</select>
        <select value={filterActive} onChange={e=>setFilterActive(e.target.value)} style={{...inp,width:'auto'}}><option value="all">Все</option><option value="active">Активные</option><option value="inactive">Неактивные</option></select>
      </div>
      {filtered.length===0 ? (
        <div style={{background:'white',borderRadius:12,padding:60,textAlign:'center'}}><div style={{fontSize:36,marginBottom:12}}>🏷</div><div>{services.length===0?'Услуг ещё нет':'Ничего не найдено'}</div></div>
      ):(
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(320px, 1fr))',gap:14}}>
          {filtered.map(s=>(
            <div key={s.id} onClick={()=>setSelected(s)} className="card-hover" style={{background:'white',borderRadius:12,padding:18,cursor:'pointer',boxShadow:'0 1px 3px rgba(0,0,0,0.06)',opacity:s.active===false?0.65:1}}>
              <div style={{display:'flex',alignItems:'flex-start',gap:12,marginBottom:14}}>
                <div style={{width:42,height:42,borderRadius:8,background:BRAND_LIGHT,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="tag" size={20} color={BRAND}/></div>
                <div style={{flex:1,minWidth:0}}><div style={{fontWeight:600,fontSize:15,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{s.name}</div><div style={{fontSize:12,color:'#888',display:'flex',alignItems:'center',gap:6,marginTop:2}}><span style={{padding:'1px 6px',borderRadius:4,background:'#f0f0f0',fontSize:11}}>{s.category}</span>{s.active===false&&<span style={{padding:'1px 6px',borderRadius:4,background:'#FFEBEE',color:'#D32F2F',fontSize:11}}>Неактивна</span>}</div></div>
              </div>
              {(s.phone||s.email)&&(<div style={{fontSize:11,color:'#888',marginBottom:10,display:'flex',gap:12}}>{s.phone&&<a href={'tel:'+s.phone} onClick={e=>e.stopPropagation()} style={{color:BRAND,textDecoration:'none',display:'flex',alignItems:'center',gap:4}}><Icon name="phone" size={11} color={BRAND}/>{s.phone}</a>}{s.email&&<a href={'mailto:'+s.email} onClick={e=>e.stopPropagation()} style={{color:BRAND,textDecoration:'none',display:'flex',alignItems:'center',gap:4}}><Icon name="mail" size={11} color={BRAND}/>{s.email}</a>}</div>)}
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,paddingTop:12,borderTop:'1px solid #f0f0f0'}}>
                <div><div style={{fontSize:10,color:'#888',textTransform:'uppercase'}}>Продаж</div><div style={{fontSize:15,fontWeight:700}}>{s.paidCount}</div></div>
                <div><div style={{fontSize:10,color:'#888',textTransform:'uppercase'}}>Конверсия</div><div style={{fontSize:15,fontWeight:700,color:s.conversion>=50?'#2E7D32':s.conversion>0?'#FFA726':'#aaa'}}>{s.totalCount?s.conversion.toFixed(0)+'%':'—'}</div></div>
                <div style={{textAlign:'right'}}><div style={{fontSize:10,color:'#888',textTransform:'uppercase'}}>Доход</div><div style={{fontSize:15,fontWeight:700,color:BRAND}}>{fmtRub(s.revenue)}</div></div>
              </div>
            </div>
          ))}
        </div>
      )}

      {selected&&(()=>{
        const upd=enriched.find(x=>x.id===selected.id)||selected;
        return (
          <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100,padding:20}} onClick={()=>setSelected(null)}>
            <div style={{background:'white',borderRadius:12,padding:28,width:820,maxHeight:'90vh',overflow:'auto'}} onClick={e=>e.stopPropagation()}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
                <div style={{display:'flex',alignItems:'center',gap:14}}>
                  <div style={{width:52,height:52,borderRadius:10,background:BRAND_LIGHT,display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="tag" size={24} color={BRAND}/></div>
                  <div><h2 style={{margin:0,fontSize:20}}>{upd.name}</h2><p style={{margin:'2px 0 0',color:'#888',fontSize:13}}><span style={{padding:'2px 8px',borderRadius:4,background:'#f0f0f0',marginRight:8}}>{upd.category}</span></p></div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={()=>toggleActive(upd.id)} style={btnGhost}>{upd.active===false?'Активировать':'Деактивировать'}</button>
                  <button onClick={()=>setEditing({phone:'',email:'',telegram:'',...upd})} style={btnGhost}><Icon name="edit" size={14} style={{verticalAlign:'middle',marginRight:4}}/>Изменить</button>
                  <button onClick={()=>deleteService(upd.id)} style={{...btnGhost,color:'#d32f2f'}}><Icon name="trash" size={14} color="#d32f2f" style={{verticalAlign:'middle',marginRight:4}}/>Удалить</button>
                  <span style={{cursor:'pointer'}} onClick={()=>setSelected(null)}><Icon name="x" size={20} color="#888"/></span>
                </div>
              </div>
              {(upd.phone||upd.email||upd.telegram)&&(

// ============ ANALYTICS ============
const Analytics=({deals,services,clients,isMobile})=>{
  const paid=useMemo(()=>deals.filter(isPaidClient),[deals]);
  const years=useMemo(()=>[...new Set(paid.map(d=>new Date(d.date).getFullYear()))].sort(),[paid]);
  const colors=[BRAND,'#FFA726','#4CAF50','#7C4DFF','#E91E63'];
  const [filterYear,setFilterYear]=useState('all');
  const [filterMonth,setFilterMonth]=useState('all');
  const [aFilterCategory,setAFilterCategory]=useState('all');
  const [aFilterStatus,setAFilterStatus]=useState('all');
  const [aStartFrom,setAStartFrom]=useState('');
  const [aStartTo,setAStartTo]=useState('');
  const [aEndFrom,setAEndFrom]=useState('');
  const [aEndTo,setAEndTo]=useState('');
  const scope=useMemo(()=>paid.filter(d=>{const dt=new Date(d.date);if(filterYear!=='all'&&dt.getFullYear()!==Number(filterYear))return false;if(filterMonth!=='all'&&dt.getMonth()!==Number(filterMonth))return false;if(aFilterCategory!=='all'&&d.category!==aFilterCategory)return false;if(aStartFrom&&d.startDate&&d.startDate<aStartFrom)return false;if(aStartTo&&d.startDate&&d.startDate>aStartTo)return false;if(aEndFrom&&d.endDate&&d.endDate<aEndFrom)return false;if(aEndTo&&d.endDate&&d.endDate>aEndTo)return false;return true;}),[paid,filterYear,filterMonth,aFilterCategory,aStartFrom,aStartTo,aEndFrom,aEndTo]);
  const yearCompare=useMemo(()=>MONTHS_SHORT.map((m,i)=>{const row={month:m};years.forEach(y=>{row[y.toString()]=scope.filter(d=>new Date(d.date).getFullYear()===y&&new Date(d.date).getMonth()===i).reduce((s,d)=>s+(d.commissionRub||0),0);});return row;}),[scope,years]);
  const serviceStats=useMemo(()=>{const map={};scope.forEach(d=>{const sid=d.serviceId||'__no__';const s=services.find(x=>x.id===d.serviceId);const name=s?s.name:(d.title||'Без услуги');if(!map[sid])map[sid]={name,count:0,revenue:0,gross:0};map[sid].count+=1;map[sid].revenue+=d.commissionRub||0;map[sid].gross+=d.grossRub||0;});return Object.values(map).map(s=>({...s,avg:s.count?s.revenue/s.count:0})).sort((a,b)=>b.revenue-a.revenue);},[scope,services]);
  const conversionStats=useMemo(()=>services.map(s=>{const all=deals.filter(d=>d.serviceId===s.id);const ok=all.filter(isPaidClient);return{name:s.name,total:all.length,paid:ok.length,conv:all.length?(ok.length/all.length*100):0};}).filter(s=>s.total>0).sort((a,b)=>b.conv-a.conv).slice(0,10),[services,deals]);
  const [authorFilter,setAuthorFilter]=useState('all');
  const authorsList=useMemo(()=>{const set=new Set();deals.forEach(d=>{const a=d.createdByName||d.createdByEmail;if(a)set.add(a);});return [...set].sort();},[deals]);
  const authorScope=useMemo(()=>scope.filter(d=>{const a=d.createdByName||d.createdByEmail||'—';if(authorFilter!=='all'&&a!==authorFilter)return false;return true;}),[scope,authorFilter]);

const SettingsView=({deals,clients,services,user,reload,isMobile,isAdmin})=>{
  const [importing,setImporting]=useState(false);
  const totalIncome=deals.filter(isPaidClient).reduce((s,d)=>s+(d.commissionRub||0),0);

  const importFromJson=async e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=async ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        if(!data.deals||!Array.isArray(data.deals)){alert('Неверный формат');return;}
        if(!confirm('Импортировать '+data.deals.length+' сделок, '+(data.clients?.length||0)+' клиентов, '+(data.services?.length||0)+' услуг?'))return;
        setImporting(true);
        if(data.clients?.length){const rows=data.clients.map(c=>({id:c.id,first_name:c.firstName||c.first_name||'',last_name:c.lastName||c.last_name||'',phone:c.phone||'',email:c.email||'',telegram:c.telegram||'',comments:c.comments||[],created_at:c.createdAt||c.created_at||new Date().toISOString()}));await sb.from('clients').upsert(rows,{onConflict:'id'});}
        if(data.services?.length){const rows=data.services.map(s=>({id:s.id,name:s.name,description:s.description||'',category:s.category||'Другое',price:s.price||0,active:s.active!==false,phone:s.phone||'',email:s.email||'',telegram:s.telegram||'',created_at:s.createdAt||s.created_at||new Date().toISOString()}));await sb.from('services').upsert(rows,{onConflict:'id'});}
        if(data.deals?.length){const rows=data.deals.map(d=>({id:d.id,date:d.date,start_date:d.startDate||d.start_date||null,end_date:d.endDate||d.end_date||null,client_id:d.clientId||d.client_id||null,service_id:d.serviceId||d.service_id||null,title:d.title||'',category:d.category||'Другое',net:d.net||0,gross:d.gross||0,commission:d.commission||0,currency:d.currency||'RUB',rate:d.rate||1,rate_source:d.rateSource||d.rate_source||'rub',rate_with_markup:d.rateWithMarkup||d.rate_with_markup||1,gross_rub:d.grossRub||d.gross_rub||0,net_rub:d.netRub||d.net_rub||0,commission_rub:d.commissionRub||d.commission_rub||0,status:d.status==='Оплачено'?PAID_CLIENT:d.status||'В работе',note:d.note||'',files:d.files||[],history:d.history||[],created_at:d.createdAt||d.created_at||new Date().toISOString(),updated_at:d.updatedAt||d.updated_at||new Date().toISOString()}));await sb.from('deals').upsert(rows,{onConflict:'id'});}
        alert('Импорт завершён!');reload();
      }catch(err){alert('Ошибка: '+err.message);}
      setImporting(false);
    };
    reader.readAsText(file);
  };

  const exportAll=()=>{
    const data={deals,clients,services,exported:new Date().toISOString(),version:4};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='RM-Travel-Backup-'+todayISO()+'.json';a.click();
  };

  return (
    <div>
      <div style={{marginBottom:20}}><h1 style={{margin:0,fontSize:24}}>Настройки</h1></div>
      <div style={{background:'white',borderRadius:12,padding:isMobile?16:24,marginBottom:16,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <h3 style={{margin:'0 0 12px',fontSize:16}}>Статистика базы</h3>
        <div style={{display:'grid',gridTemplateColumns:isMobile?'1fr 1fr':'repeat(4,1fr)',gap:12}}>
          {[['Сделок',deals.length,'#222'],['Оплачено',deals.filter(isPaidClient).length,'#2E7D32'],['Клиентов',clients.length,BRAND],['Услуг',services.length,BRAND]].map(([l,v,c])=>(
            <div key={l} style={{padding:16,background:BRAND_LIGHT,borderRadius:8}}><div style={{fontSize:12,color:'#666'}}>{l}</div><div style={{fontSize:22,fontWeight:700,color:c}}>{v}</div></div>
          ))}
        </div>
        <div style={{marginTop:12,padding:16,background:'#F1F8E9',borderRadius:8}}><div style={{fontSize:12,color:'#666'}}>Общий доход</div><div style={{fontSize:22,fontWeight:700,color:BRAND}}>{fmtRub(totalIncome)}</div></div>
      </div>
      {isAdmin&&<UserManagement currentUserEmail={user?.email} isMobile={isMobile}/>}
      <div style={{background:'white',borderRadius:12,padding:24,marginBottom:16,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <h3 style={{margin:'0 0 12px',fontSize:16}}>☁️ Облачное хранилище</h3>
        <p style={{margin:'0 0 10px',fontSize:13,color:'#666'}}>Данные хранятся в <b>Supabase</b> и доступны всей команде. Вошли как: <b>{user?.email}</b></p>
        <p style={{margin:0,fontSize:13,color:'#888'}}>Проект: <b>aupxjrbauufaquqpdemw</b> (eu-north-1)</p>
      </div>
      <div style={{background:'white',borderRadius:12,padding:24,marginBottom:16,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <h3 style={{margin:'0 0 12px',fontSize:16}}>Резервные копии</h3>
        <p style={{margin:'0 0 16px',fontSize:13,color:'#888'}}>Экспортировать данные в JSON. Можно импортировать данные из старой версии CRM.</p>
        <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
          <button onClick={exportAll} style={btnPri} className="btn-primary"><Icon name="download" size={14} color="white" style={{verticalAlign:'middle',marginRight:4}}/>Скачать резервную копию</button>
          <label style={{...btnSec,display:'inline-flex',alignItems:'center',cursor:'pointer',opacity:importing?0.6:1}}>
            <Icon name="upload" size={14} style={{verticalAlign:'middle',marginRight:4}}/> {importing?'Импортируется...':'Импорт из файла (старая версия)'}
            <input type="file" accept=".json" onChange={importFromJson} style={{display:'none'}} disabled={importing}/>
          </label>
        </div>
      </div>
      <div style={{background:'white',borderRadius:12,padding:24,boxShadow:'0 1px 3px rgba(0,0,0,0.06)'}}>
        <h3 style={{margin:'0 0 8px',fontSize:16}}>Логика учёта</h3>
        <p style={{margin:'0 0 6px',fontSize:13,color:'#666'}}>В финансах учитываются только сделки <b>«Завершен»</b>.</p>
        <p style={{margin:0,fontSize:13,color:'#666'}}>Статус <b>«Оплачено поставщику»</b> отражает расчёт с поставщиком и не влияет на выручку.</p>
      </div>
    </div>
  );
};

// ============ ЛИЧНЫЕ КАБИНЕТЫ ============
const CopyBtn=({value,label})=>{
  const [copied,setCopied]=useState(false);
  const doCopy=async(e)=>{
    e.stopPropagation();
    try{await navigator.clipboard.writeText(value||'');}catch(err){const t=document.createElement('textarea');t.value=value||'';document.body.appendChild(t);t.select();try{document.execCommand('copy');}catch(e2){}document.body.removeChild(t);}
    setCopied(true);setTimeout(()=>setCopied(false),1200);
  };
  return (
    <button onClick={doCopy} title={'Копировать '+(label||'')} style={{padding:'6px 10px',background:copied?'#E8F5E9':BRAND_LIGHT,color:copied?'#2E7D32':BRAND,border:'none',borderRadius:6,cursor:'pointer',fontSize:12,fontWeight:600,display:'flex',alignItems:'center',gap:5,whiteSpace:'nowrap'}}>
      <Icon name="copy" size={13} color={copied?'#2E7D32':BRAND}/>{copied?'Скопировано':'Копировать'}
    </button>
  );
};

    const row={id:a.id,name:a.name,login:a.login||'',password:a.password||'',note:a.note||'',updated_at:new Date().toISOString()};
    if(accounts.find(x=>x.id===a.id)){
      await sb.from('accounts').update(row).eq('id',a.id);
    }else{
      row.created_by=user?.id||null;
      row.created_by_email=user?.email||null;

          {filtered.map(a=>(

              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:14,gap:8}}>
                <div style={{display:'flex',alignItems:'center',gap:10,minWidth:0}}>
                  <div style={{width:38,height:38,borderRadius:8,background:BRAND_LIGHT,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Icon name="key" size={18} color={BRAND}/></div>
